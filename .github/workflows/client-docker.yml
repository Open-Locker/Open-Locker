name: Locker Client Docker Build

on:
  pull_request:
    paths:
      - 'locker-client/**'
      - '.github/workflows/client-docker.yml'
  push:
    branches:
      - main
      - dev
    tags:
      - 'locker-client-v*'
    paths:
      - 'locker-client/**'
      - '.github/workflows/client-docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-quality:
    name: Release quality gate
    if: startsWith(github.ref, 'refs/tags/locker-client-v')
    uses: ./.github/workflows/locker-client-ci.yml
    permissions:
      contents: read

  build:
    needs: release-quality
    if: always() && (needs.release-quality.result == 'success' || needs.release-quality.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/locker-client
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=match,pattern=locker-client-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./locker-client
          file: ./locker-client/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=locker-client
          cache-to: type=gha,mode=max,scope=locker-client
