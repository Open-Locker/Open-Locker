name: Backend Quality

on:
  pull_request:
    paths:
      - 'docs/asyncapi/**'
      - 'locker-backend/**'
      - '.github/workflows/mqtt-contract-ci.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/asyncapi/**'
      - 'locker-backend/**'
      - '.github/workflows/mqtt-contract-ci.yml'

jobs:
  backend:
    name: Backend test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_CONFIG_CACHE: ${{ github.workspace }}/locker-backend/storage/framework/ci-config.php
      APP_EVENTS_CACHE: ${{ github.workspace }}/locker-backend/storage/framework/ci-events.php
      APP_PACKAGES_CACHE: ${{ github.workspace }}/locker-backend/storage/framework/ci-packages.php
      APP_ROUTES_CACHE: ${{ github.workspace }}/locker-backend/storage/framework/ci-routes.php
      APP_SERVICES_CACHE: ${{ github.workspace }}/locker-backend/storage/framework/ci-services.php
    defaults:
      run:
        working-directory: locker-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: sqlite3

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting (Pint)
        run: composer format-check

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Run backend test suite
        run: composer test
