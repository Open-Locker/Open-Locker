name: Locker Firmware Quality

# No branch filter on pull_request: the SoftAP PR may target the first
# firmware PR's branch until that one merges, and must be checked too.
on:
  pull_request:
    paths:
      - 'locker-firmware/**'
      - '!locker-firmware/**/*.md'
      - 'docs/plans/esp32-rs485-hexagonal-client.md'
      - 'docs/asyncapi/**'
      - '.github/workflows/locker-firmware-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'locker-firmware/**'
      - '!locker-firmware/**/*.md'
      - 'docs/plans/esp32-rs485-hexagonal-client.md'
      - 'docs/asyncapi/**'
      - '.github/workflows/locker-firmware-ci.yml'

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  locker-firmware-ci:
    name: Static and host gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: locker-firmware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: locker-firmware/pnpm-lock.yaml

      # The tests of the Python tools use the standard library only.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tool dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and host gates
        run: node scripts/verify.mjs --skip-target

      - name: Build the firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
          path: locker-firmware
