name: Locker Client Quality

on:
  workflow_call:
  pull_request:
    paths:
      - 'docs/asyncapi/**'
      - 'locker-client/**'
      - '.github/workflows/locker-client-ci.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/asyncapi/**'
      - 'locker-client/**'
      - '.github/workflows/locker-client-ci.yml'

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Checks and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: locker-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: locker-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

      - name: Run tests
        run: pnpm test
