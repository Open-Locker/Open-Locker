[changelog]
header = ""
body = """
{% if commits | length == 0 %}
No locker client changes were detected.
{% else %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Open-Locker/Open-Locker/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{% endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
tag_pattern = "^client-v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
include_paths = ["locker-client/**"]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs?", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^(build|ci)", group = "Build and CI" },
    { message = "^(chore|style)", group = "Maintenance" },
]
protect_breaking_commits = true
sort_commits = "oldest"
