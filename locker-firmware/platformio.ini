; Target build for the bench board. The platform release pins the ESP-IDF
; version and the toolchain; change it only on purpose.

[platformio]
src_dir = main

[env:wemos_d1_mini32]
platform = platformio/espressif32@6.10.0
board = wemos_d1_mini32
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
